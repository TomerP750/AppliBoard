name: CI

on: 
  workflow_dispatch:
  
jobs:
  backend:
    name: Backend unit tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: appliboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: appliboard/pom.xml

      - name: Run unit tests and build
        run: >
          bash ./mvnw -B
          -Dtest=UserServiceTest,JobApplicationServiceTest
          verify