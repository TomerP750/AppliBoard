version: '3'

services:
  backend:
    build:
      context: ./appliboard
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/AppliBoard
      SPRING_MONGODB_URI: mongodb://mongodb:27017/AppliBoard
      SPRING_AI_OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
  

  frontend: 
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports: 
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    command: ["npm", "run", "dev"]
    

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: AppliBoard
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # healthcheck:
    #   test:
    #     - CMD-SHELL
    #     - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1"'
    #   interval: 5s
    #   timeout: 5s
    #   retries: 20
    #   start_period: 30s
  
volumes:
  mysql_data:

