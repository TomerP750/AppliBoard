services:
  backend:
    build:
      context: ./appliboard
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/AppliBoard
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started


  frontend: 
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports: 
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    command: ["npm", "run", "dev"]
    

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: AppliBoard
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # The backend waits for this. TCP (-h 127.0.0.1) only answers once the real server is up, not during the
    # first-start initialization. "ping" needs no password: it succeeds as soon as the server is running.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8.8.3-alpine
    ports:
      - "6380:6379"
    # Redis holds refresh-token sessions (no other copy exists) as well as the analytics cache, so:
    # - appendonly: sessions are written to disk and survive a restart, so users stay logged in.
    # - noeviction: when memory is full, Redis refuses new writes instead of deleting keys, so sessions are never
    #   dropped at random. Login then fails closed, and the analytics cache falls back to MySQL.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:

