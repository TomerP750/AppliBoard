version: '3'

services:
  backend:
    build:
      context: ./appliboard
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/AppliBoard
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started


  frontend: 
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports: 
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    command: ["npm", "run", "dev"]
    

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: AppliBoard
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # healthcheck:
    #   test:
    #     - CMD-SHELL
    #     - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1"'
    #   interval: 5s
    #   timeout: 5s
    #   retries: 20
    #   start_period: 30s

  redis:
    image: redis:8.8.3-alpine
    ports:
      - "6380:6379"
    # A pure cache: no persistence (MySQL is the source of truth), capped memory, least recently used keys evicted first.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

volumes:
  mysql_data:

