spring.application.name=appliboard

spring.datasource.url=jdbc:mysql://localhost:3306/AppliBoard?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#ddl-update not in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=900000
# A login session (refresh token family) lives at most 7 days; rotation does not extend it.
jwt.refresh-expiration-ms=604800000
# Secure cookies need HTTPS. Local dev runs on http, so this is off unless AUTH_COOKIE_SECURE=true.
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}

# Redis (runs in Docker). Defaults match the local container published on host port 6380 (docker-compose.yml).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
# Short timeouts: if Redis hangs, requests fall back to MySQL quickly instead of waiting.
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=500ms

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# AI: chat uses Anthropic (Claude). The API key comes from the ANTHROPIC_API_KEY env var.
# The other AI model types stay disabled.
spring.ai.model.chat=anthropic
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-haiku-5-5
spring.ai.anthropic.chat.options.max-tokens=1000
