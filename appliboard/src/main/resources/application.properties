spring.application.name=appliboard

spring.datasource.url=jdbc:mysql://localhost:3306/AppliBoard?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}


spring.mongodb.uri=mongodb://localhost:27017/AppliBoard

jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

#spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB