spring.application.name=appliboard

spring.datasource.url=jdbc:mysql://localhost:3306/AppliBoard?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}


spring.mongodb.uri=mongodb://localhost:27017/AppliBoard

jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer
spring.kafka.consumer.group-id=appliboard-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the JSON deserializer: a message that can't be deserialized
# is handed to the error handler (logged and skipped) instead of blocking the partition forever.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.backend.appliboard.*
# AI: chat uses Anthropic (Claude). The API key comes from the ANTHROPIC_API_KEY env var.
# The other AI model types stay disabled.
spring.ai.model.chat=anthropic
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-haiku-5-5
spring.ai.anthropic.chat.options.max-tokens=16000
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Kafka is disabled for local runs without a broker (no topics, listeners or stale reminders).
# Set to true (or remove) when Kafka is running.
appliboard.kafka.enabled=false
